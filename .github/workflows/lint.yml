name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck --severity=warning --exclude=SC2034 ./*.sh

      - name: yamllint
        run: |
          pip install --quiet yamllint
          yamllint .

      - name: Ruff
        run: |
          pip install --quiet ruff
          ruff check --select E,F ./*.py
