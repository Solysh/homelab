name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    # A force push leaves the action with a before-commit that no longer
    # exists, so its range scan fails with "unknown revision". Skip it.
    if: ${{ github.event_name != 'push' || !github.event.forced }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
